<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#48B2E9">
  <meta name="apple-mobile-web-app-title" content="Iris">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4">
  <link rel="shortcut icon" href="icon.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=4">
  <link rel="manifest" href="manifest.json?v=4">
  <link rel="stylesheet" href="style.css?v=342">
  <script>
    window.onerror = function (msg, url, line, col, error) {
      console.error("[Iris Fatal UI Error]", msg, url, line, col, error);
      return false;
    };
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img class="logo-circle" src="Iris_full.png" alt="Iris">
        <div class="logo-text">
          <h2>Iris</h2>
          <span>System Interface</span>
        </div>
      </div>
      <nav>
        <button type="button" class="nav-item active" data-page="dashboard" aria-current="page">
          <span class="material-icons-outlined">dashboard</span>
          <span class="label">Dashboard</span>
        </button>
        <button type="button" class="nav-item" data-page="profiles">
          <span class="material-icons-outlined">layers</span>
          <span class="label" id="profiles-nav-label">Profiles</span>
        </button>
        <button type="button" class="nav-item" data-page="library">
          <span class="material-icons-outlined">photo_library</span>
          <span class="label">Library</span>
        </button>
        <button type="button" class="nav-item" data-page="notifications">
          <span class="material-icons-outlined">notifications</span>
          <span class="label">Notifications</span>
        </button>
        <button type="button" class="nav-item" data-page="alarms">
          <span class="material-icons-outlined">alarm</span>
          <span class="label">Alarms</span>
        </button>
        <button type="button" class="nav-item" data-page="automations">
          <span class="material-icons-outlined">auto_mode</span>
          <span class="label">Automations</span>
        </button>
        <button type="button" class="nav-item" data-page="vision">
          <span class="material-icons-outlined">visibility</span>
          <span class="label">Vision</span>
        </button>
        <button type="button" class="nav-item" data-page="hardware">
          <span class="material-icons-outlined">hub</span>
          <span class="label">Hardware Plugins</span>
        </button>
      </nav>
      <div class="bottom">
        <button type="button" class="nav-item" data-page="settings">
          <span class="material-icons-outlined">settings</span>
          <span class="label">Settings</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header>
        <div class="header-left">
          <button class="hamburger" id="hamburger" aria-label="Menu">
            <span class="material-icons-outlined">menu</span>
          </button>
          <div>
            <h1>Iris</h1>
            <p>Loading...</p>
          </div>
        </div>
        <button class="done-btn" id="done-btn">Done</button>
      </header>
      <section class="content" id="content">
      </section>
    </main>
  </div>

  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- ── Screensaver Overlay ────────────────────────────────────── -->
  <div id="iris-screensaver" role="status" aria-label="Screen saver active" aria-hidden="true">
    <div class="ssv-clean-lock">
      <div class="ssv-clock-wrap">
        <span class="ssv-clock-time" id="ssv-clock-time">--:--</span>
        <span class="ssv-clock-ampm" id="ssv-clock-ampm"></span>
      </div>
      <div class="ssv-clock-date" id="ssv-clock-date"></div>
      <div class="ssv-clean-sub">TOUCH TO UNLOCK</div>
    </div>
  </div>

  <script src="settings_renderer.js?v=113"></script>
  <script src="script.js?v=445"></script>
  <noscript style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0C0D0F;color:#e8eaed;font-family:Inter,sans-serif">
    <p style="text-align:center;padding:24px">Iris requires JavaScript. Please enable it in your browser.</p>
  </noscript>
</body>
</html>
