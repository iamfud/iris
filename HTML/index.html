<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C0D0F">
<meta name="apple-mobile-web-app-title" content="Iris">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<title>Iris</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=5">

</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">

            <img class="logo-circle" src="Iris_full.png" alt="Iris">

            <div class="logo-text">

                <h2>Iris</h2>

                <span>System Interface</span>

            </div>

        </div>

        <nav>

            <a class="nav-item active" data-page="dashboard">

                <span class="material-icons-outlined">
                    dashboard
                </span>

                <span class="label">Dashboard</span>

            </a>

            <a class="nav-item" data-page="features">

                <span class="material-icons-outlined">
                    memory
                </span>

                <span class="label">Companion Device</span>

            </a>

            <a class="nav-item" data-page="plugins">

                <span class="material-icons-outlined">
                    extension
                </span>

                <span class="label">Plugins</span>

            </a>

            <a class="nav-item" data-page="alarms">

                <span class="material-icons-outlined">
                    alarm
                </span>

                <span class="label">Alarms</span>

            </a>

            <a class="nav-item" data-page="notifications">

                <span class="material-icons-outlined">
                    notifications
                </span>

                <span class="label">Notifications</span>

            </a>

            <a class="nav-item" data-page="vision">

                <span class="material-icons-outlined">
                    visibility
                </span>

                <span class="label">Vision</span>

            </a>

            <a class="nav-item" data-page="panel">

                <span class="material-icons-outlined">
                    picture_in_picture
                </span>

                <span class="label">Panel</span>

            </a>

        </nav>

        <div class="bottom">

            <a class="nav-item" data-page="settings">

                <span class="material-icons-outlined">
                    settings
                </span>

                <span class="label">Settings</span>

            </a>

        </div>

    </aside>

    <main class="main">

        <header>

            <div class="header-left">

                <button class="hamburger" id="hamburger" aria-label="Menu">

                    <span class="material-icons-outlined">menu</span>

                </button>

                <div>

                    <h1>Iris</h1>

                    <p>Loading...</p>

                </div>

            </div>

            <button class="done-btn" id="done-btn">Done</button>

        </header>

        <section class="content" id="content">
        </section>

    </main>

</div>

<div class="nav-overlay" id="nav-overlay"></div>

<script src="settings_renderer.js?v=5"></script>
<script src="script.js?v=5"></script>

</body>
</html>
