<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#48B2E9">
  <meta name="apple-mobile-web-app-title" content="Iris">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="shortcut icon" href="/icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png">
  <link rel="manifest" href="/manifest.json?v=6">
  <link rel="stylesheet" href="style.css?v=345">
  <script>
    window.onerror = function (msg, url, line, col, error) {
      console.error("[Iris Fatal UI Error]", msg, url, line, col, error);
      return false;
    };
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <img class="logo-circle" src="Iris_full.png" alt="Iris">
        <div class="logo-text">
          <h2>Iris</h2>
          <span>Command Centre</span>
        </div>
      </div>
      <nav>
        <button type="button" class="nav-item active" data-page="command" aria-current="page">
          <span class="material-icons-outlined">dashboard</span>
          <span class="label">Command Centre</span>
        </button>
        <button type="button" class="nav-item" data-page="library">
          <span class="material-icons-outlined">photo_library</span>
          <span class="label">Library</span>
        </button>
        <button type="button" class="nav-item" data-page="profiles">
          <span class="material-icons-outlined">layers</span>
          <span class="label" id="profiles-nav-label">Profiles</span>
        </button>
        <button type="button" class="nav-item" data-page="activity">
          <span class="material-icons-outlined">notifications_active</span>
          <span class="label">Activity</span>
        </button>
      </nav>
      <div class="bottom">
        <button type="button" class="nav-item" data-page="system">
          <span class="material-icons-outlined">tune</span>
          <span class="label">System</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header>
        <div class="header-left">
          <button class="hamburger" id="hamburger" aria-label="Menu">
            <span class="material-icons-outlined">menu</span>
          </button>
          <h1 id="header-title">Iris</h1>
        </div>
        <div class="header-actions" id="header-actions">
          <div class="header-profile-selector" id="header-profile-selector">
            <select class="header-profile-select" id="header-profile-select" aria-label="Select workspace profile">
              <option value="__default__">Desktop</option>
            </select>
          </div>
          <button type="button" class="header-mode-btn" id="header-mode-btn" title="Toggle Edit Workspace Mode">
            <span class="material-icons-outlined">edit</span>
            <span class="header-mode-btn-text">Edit workspace</span>
          </button>
          <button class="done-btn" id="done-btn">Close</button>
        </div>
      </header>
      <section class="content" id="content">
      </section>
    </main>
  </div>

  <div class="nav-overlay" id="nav-overlay"></div>

  <!-- ── Screensaver Overlay ────────────────────────────────────── -->
  <div id="iris-screensaver" role="status" aria-label="Screen saver active" aria-hidden="true">
    <div class="ssv-clean-lock">
      <div class="ssv-clock-wrap">
        <span class="ssv-clock-time" id="ssv-clock-time">--:--</span>
        <span class="ssv-clock-ampm" id="ssv-clock-ampm"></span>
      </div>
      <div class="ssv-clock-date" id="ssv-clock-date"></div>
      <div class="ssv-clean-sub">TOUCH TO UNLOCK</div>
    </div>
  </div>

  <script src="settings_renderer.js?v=116"></script>
  <script src="script.js?v=455"></script>
  <noscript style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0C0D0F;color:#e8eaed;font-family:Inter,sans-serif">
    <p style="text-align:center;padding:24px">Iris requires JavaScript. Please enable it in your browser.</p>
  </noscript>
</body>
</html>
