<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C0D0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iris">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="shortcut icon" href="/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png">
<link rel="manifest" href="/manifest.json?v=6">
<title>IRIS — Pair your device</title>
<style>
  :root{
    --neon:#48B2E9;
    --bg:#0C0D0F;
    --bg-card:#16171a;
    --border:#26282d;
    --fg:#e8eaed;
    --fg-dim:#8b919b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;max-width:360px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:32px 28px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
    text-align:center;
  }
  .logo{
    font-size:26px;font-weight:700;letter-spacing:6px;color:var(--neon);
    margin-bottom:18px;
  }
  .icon{
    font-size:44px;color:var(--neon);margin-bottom:16px;
  }
  h1{font-size:18px;font-weight:600;margin-bottom:10px}
  p{
    font-size:13px;color:var(--fg-dim);line-height:1.6;margin-bottom:8px;
  }
  .pw-input{
    width:100%;
    margin:14px 0 10px;
    padding:12px 14px;
    font-size:15px;
    color:var(--fg);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
  }
  .pw-input:focus{border-color:var(--neon)}
  .pw-input::placeholder{color:var(--fg-dim)}
  .go-btn{
    width:100%;
    padding:12px 14px;
    font-size:15px;font-weight:600;
    color:#0C0D0F;
    background:var(--neon);
    border:none;border-radius:10px;
    cursor:pointer;
  }
  .go-btn:disabled{opacity:.55;cursor:default}
  .error{
    margin-top:12px;
    font-size:13px;color:#ff6b6b;line-height:1.5;
    display:none;
  }
  .error.show{display:block}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .note{margin-top:18px;font-size:11px;color:var(--fg-dim)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">IRIS</div>
    <div class="icon">&#128274;</div>
    <h1>Pair your device</h1>
    <p>Enter the panel password to connect this device to Iris.</p>
    <form id="login-form">
      <label for="pw" class="sr-only">Panel password</label>
      <input type="password" id="pw" class="pw-input" placeholder="Panel password" autocomplete="current-password">
      <button type="submit" id="go" class="go-btn">Connect</button>
    </form>
    <p class="error" id="err"></p>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
      <button type="button" id="rescan-btn" style="width:100%;padding:11px 14px;font-size:14px;font-weight:600;color:var(--fg);background:#1E2024;border:1px solid #32353B;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;">
        <span>📷</span> Re-scan QR Code
      </button>
      <p class="note" style="margin-top:10px;">Switched PC or IP changed? Scan the QR code on your PC screen in Iris Settings to connect immediately.</p>
    </div>
    <p class="note" style="margin-top:14px;">
      Prefer a native app? <a href="/Iris.apk" download="Iris.apk" style="color:var(--neon);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;">📥 Download Android Companion (Iris.apk)</a>
    </p>
  </div>
  <script src="login.js"></script>
</body>
</html>
